# NVIDIA GPU (NVENC) 環境用 Docker Compose 構成 (Issue #36 Phase 3)。
#
# 前提: NVIDIA Container Toolkit が導入済みであること。
#   - Linux: `nvidia-ctk` 導入 + `--gpus all` 相当 (本ファイルの deploy ブロックで宣言)
#   - Windows Docker Desktop (WSL2): NVIDIA GPU サポート有効時でも `deploy` ブロックで宣言。
#     (Docker Engine + Container Toolkit の古典構成では下記の `runtime: nvidia` でも可)
#
# 起動:
#   docker compose -f docker-compose.nvidia.yml up -d
#
# 動作原理:
#   - NVIDIA ドライバ / NVENC ライブラリはコンテナイメージには同梱されず、
#     Container Toolkit がホストドライバを `/usr/local/nvidia` 経由でマウントします。
#   - `ENCODER_MODE=auto` (既定) では、起動時に VAAPI プローブが失敗した後、
#     FFmpeg `h264_nvenc` の 1 フレーム実エンコードプローブに成功した場合のみ NVENC を選択し、
#     いずれも失敗した場合は従来どおり `libx264` ソフトウェアエンコードへ自動降格します。
services:
  tesroid:
    image: ghcr.io/ranasgenoa/tesroid:latest
    # To build locally from source instead of pulling the prebuilt image,
    # comment out `image:` above and uncomment the `build:` block below:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tesroid-server
    init: true
    # NVIDIA GPU は /dev/dri ではなく Container Toolkit 経由で露出されるため、
    # Linux 版の devices(/dev/dri) セクションは持たせません。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, utility, compute]
    # 古典的な Docker Engine + Container Toolkit 構成で代替する場合はこちらを使用:
    # runtime: nvidia
    shm_size: 1g
    ports:
      - "${TESROID_PORT:-9001}:8080"
    volumes:
      - tesroid-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - NODE_ENV=production
      # Set your Cloudflare Tunnel token to expose Tesroid securely via HTTPS/WSS
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - BROWSER_URL=${BROWSER_URL:-https://www.youtube.com}
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1280}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-720}
      - FPS=${FPS:-30}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-1000k}
      # NVENC を明示固定する場合は ENCODER_MODE=nvenc、auto のまま能力実測で選定することもできます。
      - ENCODER_MODE=${ENCODER_MODE:-auto}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,compute,utility
    restart: unless-stopped

volumes:
  tesroid-data:
    driver: local
