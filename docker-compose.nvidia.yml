services:
  tesroid:
    image: ghcr.io/ranasgenoa/tesroid:latest
    platform: linux/amd64
    init: true
    shm_size: "1g"
    restart: unless-stopped
    ports:
      - "${TESROID_PORT:-9001}:${PORT:-8080}"
    volumes:
      - tesroid-data:/data
    environment:
      PORT: "${PORT:-8080}"
      DATA_DIR: "${DATA_DIR:-/data}"
      DISPLAY: "${DISPLAY:-:99}"
      LOCALE: "${LOCALE:-ja-JP}"
      TZ: "${TZ:-Asia/Tokyo}"
      ENCODER_MODE: "${ENCODER_MODE:-nvenc}"
      VAAPI_DEVICE: "${VAAPI_DEVICE:-}"
      LIBVA_DRIVER_NAME: "${LIBVA_DRIVER_NAME:-}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:-video,compute,utility}"
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
      TELEMETRY_LOG_DIR: "${TELEMETRY_LOG_DIR:-}"
      BUFFER_HOLD_EXPIRE_MINUTES: "${BUFFER_HOLD_EXPIRE_MINUTES:-10}"
      TINI_KILL_PROCESS_GROUP: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video, compute, utility]

volumes:
  tesroid-data:
