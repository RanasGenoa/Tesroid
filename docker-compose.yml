services:
  tesroid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesroid-server
    init: true
    # Intel / AMD GPU ハードウェアアクセラレーション (VAAPI)
    # ※ GPU のない仮想環境で動かす場合は devices セクションをコメントアウトしてください
    devices:
      - /dev/dri:/dev/dri
    shm_size: 1g
    ports:
      - "${TESROID_PORT:-9001}:8080"
    volumes:
      # 名前付きボリューム、またはホストパス (例: ./data:/data)
      - tesroid-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - NODE_ENV=production
      - BROWSER_URL=${BROWSER_URL:-https://www.youtube.com}
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1280}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-720}
      - FPS=${FPS:-30}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-1000k}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-iHD}
    restart: unless-stopped

volumes:
  tesroid-data:
    driver: local
