services:
  tesroid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesroid-server
    init: true
    # Intel / AMD GPU ハードウェアアクセラレーション (Linux VAAPI)
    # ※ Windows (Docker Desktop for Windows) 環境では docker-compose.windows.yml を使用してください:
    #      docker compose -f docker-compose.windows.yml up -d
    # ※ GPU のない環境で CPU (libx264) を使う場合は devices セクションをコメントアウトしてください (ENCODER_MODE=auto / software)
    devices:
      - /dev/dri:/dev/dri
    shm_size: 1g
    ports:
      - "${TESROID_PORT:-9001}:8080"
    volumes:
      # 名前付きボリューム、またはホストパス (例: ./data:/data)
      - tesroid-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - NODE_ENV=production
      - BROWSER_URL=${BROWSER_URL:-https://www.youtube.com}
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1280}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-720}
      - FPS=${FPS:-30}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-1000k}
      - ENCODER_MODE=${ENCODER_MODE:-auto}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-}
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-}
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  tesroid-data:
    driver: local
