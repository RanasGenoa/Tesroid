# Docker Desktop for Windows (WSL2 backend) Compose configuration.
# Run directly from Windows PowerShell or CMD:
#   docker compose -f docker-compose.windows.yml up -d
services:
  tesroid:
    image: ghcr.io/ranasgenoa/tesroid:latest
    # To build locally from source instead of pulling the prebuilt image,
    # comment out `image:` above and uncomment the `build:` block below:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tesroid-server
    init: true
    # Expose Windows WSL2 DirectX Graphics Kernel (/dev/dxg) instead of Linux /dev/dri
    # (Docker Desktop's docker-desktop VM does not provide /dev/dri by default).
    devices:
      - /dev/dxg:/dev/dxg
    shm_size: 1g
    ports:
      - "${TESROID_PORT:-9001}:8080"
    volumes:
      - tesroid-data:/data
      # Mount full /usr/lib/wsl (read-only) so DXCore/D3D12 can access both /usr/lib/wsl/lib
      # and vendor user-mode drivers under /usr/lib/wsl/drivers/.
      - /usr/lib/wsl:/usr/lib/wsl:ro
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - NODE_ENV=production
      # Set your Cloudflare Tunnel token to expose Tesroid securely via HTTPS/WSS
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
      - BROWSER_URL=${BROWSER_URL:-https://www.youtube.com}
      - DISPLAY_WIDTH=${DISPLAY_WIDTH:-1280}
      - DISPLAY_HEIGHT=${DISPLAY_HEIGHT:-720}
      - FPS=${FPS:-30}
      - VIDEO_BITRATE=${VIDEO_BITRATE:-1000k}
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      # ENCODER_MODE=auto probes VAAPI H.264 encode capability at startup and automatically
      # falls back to zero-latency CPU libx264 when D3D12 VAAPI encode is unavailable
      # (e.g. missing vgem /dev/dri node or host GPU UMD without D3D12 VAAPI encode support).
      - ENCODER_MODE=${ENCODER_MODE:-auto}
      - VAAPI_DEVICE=${VAAPI_DEVICE:-}
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-d3d12}
      # Optional: uncomment to enable Mesa D3D12 hardware WebGL/ANGLE in Chrome under Xvfb.
      # Leave unset by default so Chrome uses stable CPU Skia + llvmpipe (AGENTS.md §5.1),
      # while VaapiEncoder scopes GALLIUM_DRIVER=d3d12 strictly to FFmpeg VAAPI probes/encodes.
      # - GALLIUM_DRIVER=d3d12
    restart: unless-stopped

volumes:
  tesroid-data:
    driver: local
