name: AI PR Reviewer (Gemini 3.8 Flash)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Code Review (Antigravity)
    runs-on: [self-hosted, antigravity]
    # ドラフトPRおよび同一リポジトリ外(Fork)からのPRはセキュリティ上スキップ
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR Diff
        id: prepare_diff
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # ジョブ固有の一時作業ディレクトリを初期化
          WORKDIR="${{ runner.temp }}/ai-review-${{ github.event.pull_request.number }}"
          mkdir -p "$WORKDIR"
          echo "workdir=$WORKDIR" >> $GITHUB_OUTPUT

          # ベースブランチを確実に fetch (失敗時は明示的にエラー終了)
          if ! git fetch --no-tags --depth=1 origin "$BASE_REF"; then
            echo "::error::Failed to fetch base branch origin/$BASE_REF"
            exit 1
          fi

          # ベースブランチと PR の最新コミット (HEAD) の差分を抽出 (ロックファイル・ビルド成果物を除外)
          git diff "origin/$BASE_REF...HEAD" \
            -- . ':!package-lock.json' ':!*.lock' ':!dist' ':!build' > "$WORKDIR/pr_diff.patch"

          DIFF_LINES=$(wc -l < "$WORKDIR/pr_diff.patch")
          DIFF_SIZE=$(wc -c < "$WORKDIR/pr_diff.patch")
          echo "diff_lines=$DIFF_LINES" >> $GITHUB_OUTPUT

          if [ "$DIFF_LINES" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No meaningful code changes detected. Skipping review."
            exit 0
          fi

          # Linux カーネル引数長制限 (MAX_ARG_STRLEN: 128KB) 対策として 80KB で安全に切り詰め (バイト単位で確実に制限)
          if [ "$DIFF_SIZE" -gt 80000 ]; then
            head -c 80000 "$WORKDIR/pr_diff.patch" > "$WORKDIR/truncated_diff.patch"
            echo -e "\n\n... (差分が上限を超えたため一部省略されました)" >> "$WORKDIR/truncated_diff.patch"
            mv "$WORKDIR/truncated_diff.patch" "$WORKDIR/pr_diff.patch"
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Execute Antigravity Review
        if: steps.prepare_diff.outputs.has_changes == 'true'
        env:
          WORKDIR: ${{ steps.prepare_diff.outputs.workdir }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          cat << 'EOF' > "$WORKDIR/prompt.txt"
          あなたは Tesroid プロジェクトのシニアソフトウェアエンジニア兼コードレビュアーです。
          以下の Pull Request 差分を日本語で精査し、厳格かつ建設的なレビューを行ってください。

          ## PR 情報
          EOF
          printf -- "- **タイトル**: %s\n" "$PR_TITLE" >> "$WORKDIR/prompt.txt"
          printf -- "- **説明**: %s\n" "$PR_BODY" >> "$WORKDIR/prompt.txt"
          printf -- "- **ベースブランチ**: %s\n" "$BASE_REF" >> "$WORKDIR/prompt.txt"
          printf -- "- **PRブランチ**: %s\n" "$HEAD_REF" >> "$WORKDIR/prompt.txt"

          cat << 'EOF' >> "$WORKDIR/prompt.txt"

          ## 重点レビュー観点 (AGENTS.md 厳守)
          以下の項目に違反がある場合は【CRITICAL】判定としてください：
          1. 【車載制約】クライアント側 (client/) で <video> タグが追加・使用されていないか？（テスラ車載OSのDレンジ動画停止ガードを回避するため、必ず <canvas desynchronized> + WebCodecs API を維持すること）
          2. 【描画制約】Xvfb 環境の Chrome 起動引数に --enable-gpu-rasterization や --enable-zero-copy が追加されていないか？（Mesa llvmpipe と VAAPI が競合して画面下部が黒くフリーズするのを防ぐため）
          3. 【入力制約】タッチ入力が mousedown 1 などのマウスエミュレーションに戻っていないか？（CdpTouchBridge による CDP Input.dispatchTouchEvent を維持すること）
          4. 【通信制約】WebSocket バックプレッシャーが単一閾値でフレームドロップされていないか？（High: 768KB, Low: 128KB のヒステリシスを保つこと）
          5. 【セキュリティ】平文パスワード、SSH鍵、固定IP、ホスト固有パスがハードコードされていないか？
          6. 【品質】TypeScript 型安全性、Promise 未処理、リソース解放漏れがないか？

          ## 出力フォーマット (Markdown 形式)
          ### 1. 総合判定
          `LGTM` / `COMMENT` / `CHANGES_REQUESTED` のいずれかを太字で記載し、2〜3行で概要を要約してください。

          ### 2. 重要指摘事項 (Critical / High)
          ※動作不能、テスラ固有制約違反、セキュリティ上の問題など（なければ「なし」）
          - **対象**: `ファイルパス:行番号`
          - **問題点**:
          - **推奨修正コード例**:

          ### 3. 改善提案 (Medium / Low)
          ※可読性、型安全性、パフォーマンス改善の提案（なければ「なし」）

          ### 4. 良かった点 (Good Points)
          ※設計的に優れている点や工夫されている点

          ---
          ## コード差分 (Diff):
          EOF
          cat "$WORKDIR/pr_diff.patch" >> "$WORKDIR/prompt.txt"

          # Self-hosted Runner 内の Antigravity CLI (Gemini 3.8 Flash) を実行
          if ! agy -p "$(cat "$WORKDIR/prompt.txt")" --model gemini-3.8-flash > "$WORKDIR/review_comment.md"; then
            echo "::error::Antigravity review generation failed."
            exit 1
          fi

      - name: Post or Update PR Comment
        if: steps.prepare_diff.outputs.has_changes == 'true'
        env:
          WORKDIR: ${{ steps.prepare_diff.outputs.workdir }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # レビュー内容が空でないか検証
          if [ ! -s "$WORKDIR/review_comment.md" ]; then
            echo "Review comment is empty. Skipping comment submission."
            exit 0
          fi

          # マーカーとフッターを付与
          cat << 'EOF' > "$WORKDIR/final_comment.md"
          <!-- antigravity-pr-review -->
          EOF
          cat "$WORKDIR/review_comment.md" >> "$WORKDIR/final_comment.md"
          cat << 'EOF' >> "$WORKDIR/final_comment.md"

          ---
          *🤖 Reviewed by **Antigravity** (`gemini-3.8-flash`)*
          EOF

          # 既存のレビューコメントが存在するか検索 (マーカー一致、全ページ走査)
          EXISTING_COMMENT_ID=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- antigravity-pr-review -->")) | .id' | head -n 1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing review comment (ID: $EXISTING_COMMENT_ID)..."
            gh api \
              --method PATCH \
              "repos/$REPO/issues/comments/$EXISTING_COMMENT_ID" \
              -F body=@"$WORKDIR/final_comment.md" > /dev/null
          else
            echo "Creating new review comment..."
            gh pr comment "$PR_URL" --body-file "$WORKDIR/final_comment.md"
          fi

      - name: Cleanup Workdir
        if: always() && steps.prepare_diff.outputs.workdir != ''
        run: |
          rm -rf "${{ steps.prepare_diff.outputs.workdir }}"
