name: CI (Test & Build)

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

jobs:
  test:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Code Quality & Formatting Check (Biome)
        run: npx @biomejs/biome ci --reporter=github

      - name: TypeScript Type Check (client & server)
        run: npm run typecheck

      - name: Run full automated test & PR guardrail suite (pre-build)
        run: npm test

      - name: Run production build (client & server TypeScript + Vite)
        run: npm run build

      - name: Verify built dist compliance
        run: ./server/node_modules/.bin/vitest run client/test/dom.test.ts
