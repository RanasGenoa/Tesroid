name: CI (Test & Build)

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main, 'release/**' ]

# Security boundary: read-only GITHUB_TOKEN with pull_request sandbox only and no secrets.
permissions:
  contents: read

jobs:
  test:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code Quality, Formatting & Type Check
        run: npm run check

      - name: Run automated test & guardrail suite (pre-build)
        run: npm run test

      - name: Run production build
        run: npm run build

      - name: Verify built dist & invariant guardrails
        run: npx vitest run test/guardrails/invariants.test.ts
